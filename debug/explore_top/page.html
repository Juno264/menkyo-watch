<!DOCTYPE html><html lang="ja" class="top"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex,nofollow">
    <title id="MKAYMA00M000">警視庁　運転免許手続予約サイト</title>
    
    <link rel="stylesheet" href="./01/css/license.css" type="text/css">
    <link rel="stylesheet" href="./common/css/jquery-ui.min.css">

    <script src="./common/js/jquery-3.6.3.min.js"></script>
    <script src="./common/js/jquery-ui.min.js"></script>
    
    <script src="./01/js/MKAYMA00index000.js"></script>
    <script src="./01/js/MKAYMA001MessagesJa.js"></script>
    <script src="./01/js/MKAYMA001common.js"></script>   
</head>
<body>
    <div id="overlay" class="display_none"></div>
    <div id="modalWindow" class="display_none"><div id="modalWindowInner"></div></div>
    <div id="header">
        <div class="subheader"><span id="MKAYMA00M001">Metropolitan Police Department</span></div>
        <h1 id="MKAYMA00M002"><span>警視庁</span> <span>運転免許手続予約サイト</span></h1>
    </div>
    <noscript>
        JavaScriptが無効な環境では、本システムは利用できません。
        <style>div#container{ display:none !important; }</style>
    </noscript>
    <form id="formContainer">
        <div id="container">
            <div id="data">
                <div>
                    <div class="rightfloat">
                        <div class="leftfloat"><label for="strLangauge"><span id="MKAYMA00M003">Select a language / 言語を選択してください</span></label></div>
                        <select name="selectLangauge" id="selectLangauge" class=""><option value="ja">日本語</option><option value="en">English</option><option value="zh">中国语</option><option value="vi">Tiếng Việt</option><option value="ne">नेपाली</option><option value="my">မြန်မာဘာသာ</option></select>
                    </div>
                </div>
                <div class="block" id="page00">
                    <h2><span id="MKAYMA00M331">選択してください。</span></h2>             
                    <span class="">
                        <span id="MKAYMA00M332">運転免許の更新、仮免許学科試験及び学科試験の手続は、事前予約制となりました。</span><br><br>
                        <span id="MKAYMA00M333">ご希望の予約手続を下記より選択の上、手続を開始してください。</span><br><br><br>
                    </span>
                    <div class="item">
                        <div id="" class="">
                            <span class="radioselectBtn">
                                <label class=""><input type="radio" id="licenserenew" class="radio2"><span class="radio2label"><span class="radio-main" id="MKAYMA00M334">運転免許更新の予約はこちら</span></span></label>
                                <label class=""><input type="radio" id="provisional" class="radio2"><span class="radio2label"><span class="radio-main" id="MKAYMA00M335">仮免許学科試験の予約はこちら</span></span></label>
                                <label class=""><input type="radio" id="licensetest" class="radio2"><span class="radio2label"><span class="radio-main" id="MKAYMA00M336">学科試験の予約はこちら</span></span></label>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>


</body></html>
