name: menkyo-loop
# 1回のジョブで約5時間半、15分ごとにスキャンを続け、最後に次のジョブを自分で起動する
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */2 * * *"          # 保険：ループが止まっていたら再開（動いている間は待機列に入るだけ）
  push:
    paths: ["run/loop.txt"]         # このファイルを書き換えてpushすると開始

concurrency:
  group: menkyo-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Tokyo
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      MODE: ${{ vars.MODE || 'observe' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor-requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('monitor-requirements.txt') }}
      - run: pip install -r monitor-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          git config user.name "menkyo-bot"
          git config user.email "menkyo-bot@users.noreply.github.com"
      - name: Watch loop
        run: python watch.py loop
      - name: Start next loop
        if: always() && hashFiles('run/stop') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run loop.yml --ref main
