name: menkyo-monitor

on:
  push:
    paths: ["run/cmd.txt"]       # このファイルを書き換えてpushすると、その内容のコマンドを実行
  workflow_dispatch:
    inputs:
      cmd:
        description: "check / explore <name> / analyze / test-notify"
        default: "check"

concurrency:
  group: menkyo
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      TZ: Asia/Tokyo
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      BOOKING_INFO: ${{ secrets.BOOKING_INFO }}
      MY_DATE: ${{ vars.MY_DATE }}
      MODE: ${{ vars.MODE || 'observe' }}
      GH_TOKEN: ${{ github.token }}
      JITTER_MAX_SEC: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Get latest data
        run: git pull -q --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor-requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('monitor-requirements.txt') }}
      - run: pip install -r monitor-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then CMD="$(head -1 run/cmd.txt)";
          else CMD="${{ github.event.inputs.cmd || 'watch run' }}"; fi
          CMD="${CMD#direct:}"
          echo "cmd: $CMD"
          case "$CMD" in
            restart-loop)
              for id in $(gh run list --workflow loop.yml --json databaseId,status -q '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId'); do gh run cancel $id || true; done
              sleep 20; gh workflow run loop.yml --ref main ;;
            watch\ *) python watch.py ${CMD#watch } ;;
            *) python monitor.py $CMD ;;
          esac
      - name: Save data
        if: always()
        run: |
          git config user.name "menkyo-bot"
          git config user.email "menkyo-bot@users.noreply.github.com"
          for f in debug; do [ -e "$f" ] && git add -A -- "$f"; done; true
          git diff --cached --quiet || git commit -m "data $(date '+%m/%d %H:%M')" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
